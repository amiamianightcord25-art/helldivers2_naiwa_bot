[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "helldivers2-qq-bot"
version = "0.3.0"
description = "HELLDIVERS 2 CLI and NoneBot2 bot for official QQ and NapCat"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.3,<4", "python-dotenv>=1.1,<2", "aiosqlite>=0.21,<1",
    "nonebot2[aiohttp]==2.5.0", "nonebot-adapter-qq==1.7.2",
    "nonebot-adapter-onebot==2.4.6", "pydantic>=2.13,<3",
    "playwright==1.63.0", "Jinja2>=3.1.6,<4", "Pillow>=12,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "aioresponses>=0.7.8,<1", "ruff>=0.12,<1"]

[project.scripts]
hd2bot = "hd2bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hd2bot = ["assets/*.json", "assets/*.png", "assets/wiki_images/*", "rendering/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--basetemp=.pytest-tmp"
cache_dir = ".cache/pytest"

[tool.ruff]
cache-dir = ".cache/ruff"
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
